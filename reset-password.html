<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0B3B3C"><meta name="robots" content="noindex"><title>Reset Password · Yenga Area</title><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Hind+Madurai:wght@400;700&display=swap" rel="stylesheet">
<style>:root{--disp:'Bricolage Grotesque','Hind Madurai',system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:16px;color:#fff;font:1rem 'Hind Madurai',system-ui,sans-serif;background:radial-gradient(ellipse at 15% 25%,#1a8f91,transparent 55%),linear-gradient(160deg,#0f5254,#0B3B3C 70%,#082b2c)}
.card{width:100%;max-width:420px;background:rgba(8,48,50,.85);border:2px solid rgba(255,200,87,.45);border-radius:28px;padding:22px 20px;box-shadow:0 18px 40px -12px rgba(0,0,0,.55)}
h1{font-family:var(--disp);color:#FFC857;margin:0 0 6px;font-size:1.6rem;text-align:center}p{margin:.3em 0 1em;text-align:center;color:#cfe6e3}
input{width:100%;min-height:48px;margin-top:10px;font:inherit;font-size:16px;color:#fff;background:rgba(5,34,36,.8);border:1.5px solid rgba(255,200,87,.4);border-radius:999px;padding:0 18px}input:focus{outline:3px solid #FFC857aa;border-color:#FFC857}
button{width:100%;min-height:52px;margin-top:16px;border:0;border-radius:999px;background:linear-gradient(#FFD36E,#F5A524);color:#0B3B3C;font:800 1.15rem var(--disp);cursor:pointer;box-shadow:0 4px 0 #b87413}button:disabled{opacity:.7;cursor:wait}
button:focus-visible,a:focus-visible{outline:3px solid #FFC857;outline-offset:2px}
#msg{min-height:1.4em;margin:12px 0 0;font-weight:700;font-size:.92rem}#msg.err{color:#ffb4a8}#msg.ok{color:#8ff0c0}a{color:#FFC857;font-weight:700}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"><\/script>');</script>
<script>window.supabase||document.write('<script src="supabase.js"><\/script>');</script></head>
<body><main class="card"><h1>New Password</h1><p id="hint">Checking your reset link…</p>
<form id="f" novalidate hidden><input id="p1" type="password" autocomplete="new-password" placeholder="New Password (8+ characters)" aria-label="New password"><input id="p2" type="password" autocomplete="new-password" placeholder="Confirm Password" aria-label="Confirm password"><button id="b" type="submit">Save Password</button></form>
<p id="msg" class="msg" aria-live="polite"></p><p><a href="index.html">Back to Sign In</a></p></main>
<script>
(function(){var $=function(i){return document.getElementById(i)},msg=function(t,c){$('msg').textContent=t;$('msg').className=c||''};
if(!window.supabase){$('hint').textContent='';return msg('Page could not load. Refresh and try again.','err')}
var sb=supabase.createClient('https://geinocdanrtpjbscfxhn.supabase.co','sb_publishable_uc09IiXZhBQD6TLKdHRVdg_GyT7yDN8'),ready=false;
function show(){ready=true;$('hint').textContent='Choose a new password for your account.';$('f').hidden=false}
sb.auth.onAuthStateChange(function(ev){if(ev==='PASSWORD_RECOVERY')show()});
setTimeout(function(){if(!ready){$('hint').textContent='';msg('This reset link is invalid or has expired. Please request a new one.','err')}},4000);
$('f').addEventListener('submit',async function(e){e.preventDefault();var a=$('p1').value;
if(a.length<8)return msg('Password needs at least 8 characters.','err');if(a!==$('p2').value)return msg('Passwords don’t match.','err');
var b=$('b');b.disabled=true;
try{var r=await sb.auth.updateUser({password:a});if(r.error)throw r.error;msg('Password updated! Taking you to Sign In…','ok');await sb.auth.signOut();setTimeout(function(){location.href='index.html'},1800)}
catch(err){msg(err.message||'Could not update password. Try again.','err');b.disabled=false}});})();
</script></body></html>
