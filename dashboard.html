async function loadPeople(q=''){let r=await sb.from('profiles').select('id,username,area,bio,avatar_url').neq('id',user.id).limit(60);if(r.error)return;let list=(r.data||[]).filter(x=>!q||[x.username,x.area,x.bio].join(' ').toLowerCase().includes(q.toLowerCase()));$('people').innerHTML=list.map(x=>'<div class="feeditem"><b>'+esc(x.username||'Member')+'</b><div class="small">'+esc(x.area||'')+'</div><button class="btn follow" data-id="'+x.id+'">Follow / Unfollow</button></div>').join('')||'<div class="empty">No people found</div>';document.querySelectorAll('.follow').forEach(b=>b.onclick=()=>follow(b.dataset.id))}async function follow(id){let check=await sb.from('follows').select('*').eq('follower_id',user.id).eq('following_id',id).maybeSingle();if(check.error){alert(check.error.message);return}if(check.data){let x=await sb.from('follows').delete().eq('follower_id',user.id).eq('following_id',id);if(x.error)alert(x.error.message)}else{let x=await sb.from('follows').insert({follower_id:user.id,following_id:id});if(x.error)alert(x.error.message);else await sb.from('notifications').insert({user_id:id,actor_id:user.id,kind:'follow',content:'started following you'})}loadPeople($('search').value)}$('search').oninput=()=>loadPeople($('search').value);
async function loadAlerts(){let r=await sb.from('notifications').select('*').eq('user_id',user.id).order('created_at',{ascending:false}).limit(50);if(r.error){$('alerts').innerHTML='<div class="empty">Notification setup issue</div>';return}let rows=r.data||[];$('alerts').innerHTML=rows.map(x=>'<div class="feeditem"><span class="badge">'+esc(x.kind)+'</span> '+esc(x.content)+'<div class="small">'+new Date(x.created_at).toLocaleString()+'</div>'+(x.read?'':'<button class="btn secondary mark" data-id="'+x.id+'">Mark read</button>')+'</div>').join('')||'<div class="empty">No notifications yet</div>';document.querySelectorAll('.mark').forEach(b=>b.onclick=async()=>{await sb.from('notifications').update({read:true}).eq('id',b.dataset.id);loadAlerts()})}$('tileAlerts').onclick=async()=>{show('alertsPanel');await loadAlerts()};document.querySelector('[data-section="alerts"]').onclick=$('tileAlerts').onclick;
async function loadMessagePeople(q=''){let r=await sb.from('profiles').select('id,username,area').neq('id',user.id).limit(50);if(r.error)return;$('messagePeople').innerHTML=(r.data||[]).filter(x=>!q||x.username?.toLowerCase().includes(q.toLowerCase())).map(x=>'<div class="feeditem"><b>'+esc(x.username||'Member')+'</b> <button class="btn secondary startchat" data-id="'+x.id+'" data-name="'+esc(x.username||'Member')+'">Chat</button></div>').join('');document.querySelectorAll('.startchat').forEach(b=>b.onclick=()=>openChat(b.dataset.id,b.dataset.name))}$('messageSearch').oninput=()=>loadMessagePeople($('messageSearch').value);async function openChat(id,name){chatUser=id;$('chat').classList.remove('hidden');$('chatTitle').textContent='Chat with '+name;await loadChat()}async function loadChat(){let r=await sb.from('messages').select('*').or('and(sender_id.eq.'+user.id+',receiver_id.eq.'+chatUser+'),and(sender_id.eq.'+chatUser+',receiver_id.eq.'+user.id+')').order('created_at');if(r.error){$('chatMessages').textContent=r.error.message;return}$('chatMessages').innerHTML=(r.data||[]).map(m=>'<div class="feeditem" style="text-align:'+(m.sender_id===user.id?'right':'left')+'">'+esc(m.body)+'<div class="small">'+new Date(m.created_at).toLocaleString()+'</div></div>').join('');$('chatMessages').scrollTop=$('chatMessages').scrollHeight}$('sendMessage').onclick=async()=>{let body=$('messageBody').value.trim();if(!body||!chatUser)return;let r=await sb.from('messages').insert({sender_id:user.id,receiver_id:chatUser,body});if(r.error){alert(r.error.message);return}await sb.from('notifications').insert({user_id:chatUser,actor_id:user.id,kind:'message',content:'sent you a message'});$('messageBody').value='';loadChat()};$('tileMessages').onclick=()=>show('messagesPanel');document.querySelector('[data-section="profile"]').onclick=$('openProfile').onclick;document.querySelector('[data-section="explore"]').onclick=$('tileExplore').onclick=()=>{document.getElementById('search').focus();window.scrollTo({top:0,behavior:'smooth'})};document.querySelector('[data-section="create"]').onclick=()=>{ $('postBody').focus();window.scrollTo({top:0,behavior:'smooth'})};document.querySelector('[data-section="home"]').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
