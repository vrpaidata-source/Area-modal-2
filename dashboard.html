(()=>{const URL='https://geinocdanrtpjbscfxhn.supabase.co',KEY='sb_publishable_uc09IiXZhBQD6TLKdHRVdg_GyT7yDN8', $=id=>document.getElementById(id),sb=window.supabase?.createClient(URL,KEY);let user=null,profile=null,chatUser=null,timeout;const INACTIVE=10*60*1000,token=sessionStorage.getItem('yau_device_token');function goLogin(){location.replace('index.html')}function net(){ $('net').classList.toggle('on',!navigator.onLine)}addEventListener('online',net);addEventListener('offline',net);net();function reset(){clearTimeout(timeout);timeout=setTimeout(async()=>{await logout(true)},INACTIVE)}['pointerdown','keydown','touchstart','scroll'].forEach(e=>document.addEventListener(e,reset,{passive:true}));async function rpc(name,args){let r=await sb.rpc(name,args);if(r.error)throw r.error;return r.data}function show(id){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('show'));$(id).classList.add('show')}function closePanels(){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('show'))}document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closePanels);document.querySelectorAll('.panel').forEach(p=>p.onclick=e=>{if(e.target===p)closePanels()});function avatarHTML(url,name){return url?'<img src="'+url+'" alt="">':(name||'Y').slice(0,1).toUpperCase()}async function init(){try{if(!sb){$('loadmsg').textContent='Supabase library unavailable';return}let s=await sb.auth.getSession();if(!s.data.session)return goLogin();let v=await sb.auth.getUser();if(v.error||!v.data.user)return goLogin();user=v.data.user;if(!token)return goLogin();let locked=await rpc('verify_device_lock',{p_device_token:token});if(!locked)return goLogin();let n=user.user_metadata?.full_name||user.email||'Member';$('welcome').textContent='Welcome, '+n+'!';$('avatar')&&($('avatar').textContent=n[0]);$('composerAvatar').textContent=n[0];$('loading').classList.add('hidden');$('app').classList.remove('hidden');reset();await loadProfile();await loadFeed();await loadPeople();await loadAlerts();await loadMessagePeople();sb.auth.onAuthStateChange((ev,s)=>{if(!s)goLogin()})}catch(e){$('loadmsg').textContent='Dashboard setup failed: '+e.message;console.error(e)}}async function loadProfile(){let r=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();if(r.error)throw r.error;profile=r.data||{};$('username').value=profile.username||user.email.split('@')[0];$('bio').value=profile.bio||'';$('area').value=profile.area||'';let url=profile.avatar_url;$('profilePhoto').innerHTML=avatarHTML(url,profile.username);$('openProfile').innerHTML=avatarHTML(url,profile.username);$('composerAvatar').innerHTML=avatarHTML(url,profile.username)}$('openProfile').onclick=$('tileProfile').onclick=()=>show('profilePanel');$('saveProfile').onclick=async()=>{let b=$('saveProfile');b.disabled=true;try{let avatar_url=profile.avatar_url||null,f=$('profileFile').files[0];if(f){if(f.size>5*1024*1024)throw Error('Profile photo 5MB-க்கு கீழே இருக்க வேண்டும்');let ext=(f.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,''),path=user.id+'/'+Date.now()+'.'+ext;let u=await sb.storage.from('profile-photos').upload(path,f,{upsert:true,contentType:f.type});if(u.error)throw u.error;avatar_url=sb.storage.from('profile-photos').getPublicUrl(path).data.publicUrl}let row={id:user.id,username:$('username').value.trim(),bio:$('bio').value.trim(),area:$('area').value.trim(),avatar_url,updated_at:new Date().toISOString()};if(!row.username)throw Error('Username தேவை');let r=await sb.from('profiles').upsert(row,{onConflict:'id'});if(r.error)throw r.error;profile=row;$('profileMsg').textContent='Saved!';await loadProfile()}catch(e){$('profileMsg').textContent=e.message}finally{b.disabled=false}};
async function uploadPostPhoto(f){if(!f)return null;if(f.size>8*1024*1024)throw Error('Post photo 8MB-க்கு கீழே இருக்க வேண்டும்');let ext=(f.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,''),path=user.id+'/'+Date.now()+'.'+ext;let r=await sb.storage.from('post-photos').upload(path,f,{upsert:false,contentType:f.type});if(r.error)throw r.error;return sb.storage.from('post-photos').getPublicUrl(path).data.publicUrl}async function loadFeed(){let r=await sb.from('posts').select('*').order('created_at',{ascending:false}).limit(60);if(r.error){$('feed').innerHTML='<div class="empty">Feed load failed. Setup SQL/storage first.</div>';return}let posts=r.data||[];if(!posts.length){$('feed').innerHTML='<div class="empty">இன்னும் posts இல்லை. முதல் post நீங்களே போடுங்கள்! ✨</div>';return}let ids=[...new Set(posts.map(p=>p.user_id))],pr=await sb.from('profiles').select('id,username,avatar_url').in('id',ids),map={};(pr.data||[]).forEach(x=>map[x.id]=x);$('feed').innerHTML=posts.map(p=>{let a=map[p.user_id]||{},mine=p.user_id===user.id;return '<article class="post" data-id="'+p.id+'"><div class="posthead"><div class="avatar">'+avatarHTML(a.avatar_url,a.username)+'</div><div class="meta"><b>'+esc(a.username||'Member')+'</b><div class="small">'+new Date(p.created_at).toLocaleString()+'</div></div>'+(!mine?'':'<button class="btn secondary edit">Edit</button><button class="btn danger del">Delete</button>')+'</div><div class="bodytext">'+esc(p.body||'')+'</div>'+(p.image_url?'<img src="'+p.image_url+'">':'')+'<div class="postactions"><button class="btn secondary followpost" data-user="'+p.user_id+'" '+(mine?'disabled':'')+'>Follow</button></div></article>'}).join('');$('feed').querySelectorAll('.del').forEach(b=>b.onclick=async()=>{let id=b.closest('.post').dataset.id;if(!confirm('Delete this post?'))return;let x=await sb.from('posts').delete().eq('id',id).eq('user_id',user.id);if(x.error)alert(x.error.message);else loadFeed()});$('feed').querySelectorAll('.edit').forEach(b=>b.onclick=async()=>{let el=b.closest('.post'),id=el.dataset.id;let text=el.querySelector('.bodytext').textContent,n=prompt('Edit post',text);if(n===null)return;let x=await sb.from('posts').update({body:n}).eq('id',id).eq('user_id',user.id);if(x.error)alert(x.error.message);else loadFeed()});$('feed').querySelectorAll('.followpost').forEach(b=>b.onclick=()=>follow(b.dataset.user))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))} $('createPost').onclick=async()=>{let body=$('postBody').value.trim(),f=$('postFile').files[0];if(!body&&!f){$('status').textContent='Text or photo சேர்க்கவும்';return}let b=$('createPost');b.disabled=true;$('status').textContent='Posting…';try{let image_url=await uploadPostPhoto(f),r=await sb.from('posts').insert({user_id:user.id,body,image_url});if(r.error)throw r.error;$('postBody').value='';$('postFile').value='';$('status').textContent='Posted!';await loadFeed()}catch(e){$('status').textContent=e.message}finally{b.disabled=false}};
async function loadPeople(q=''){let r=await sb.from('profiles').select('id,username,area,bio,avatar_url').neq('id',user.id).limit(60);if(r.error)return;let list=(r.data||[]).filter(x=>!q||[x.username,x.area,x.bio].join(' ').toLowerCase().includes(q.toLowerCase()));$('people').innerHTML=list.map(x=>'<div class="feeditem"><b>'+esc(x.username||'Member')+'</b><div class="small">'+esc(x.area||'')+'</div><button class="btn follow" data-id="'+x.id+'">Follow / Unfollow</button></div>').join('')||'<div class="empty">No people found</div>';document.querySelectorAll('.follow').forEach(b=>b.onclick=()=>follow(b.dataset.id))}async function follow(id){let check=await sb.from('follows').select('*').eq('follower_id',user.id).eq('following_id',id).maybeSingle();if(check.error){alert(check.error.message);return}if(check.data){let x=await sb.from('follows').delete().eq('follower_id',user.id).eq('following_id',id);if(x.error)alert(x.error.message)}else{let x=await sb.from('follows').insert({follower_id:user.id,following_id:id});if(x.error)alert(x.error.message);else await sb.from('notifications').insert({user_id:id,actor_id:user.id,kind:'follow',content:'started following you'})}loadPeople($('search').value)}$('search').oninput=()=>loadPeople($('search').value);
async function loadAlerts(){let r=await sb.from('notifications').select('*').eq('user_id',user.id).order('created_at',{ascending:false}).limit(50);if(r.error){$('alerts').innerHTML='<div class="empty">Notification setup issue</div>';return}let rows=r.data||[];$('alerts').innerHTML=rows.map(x=>'<div class="feeditem"><span class="badge">'+esc(x.kind)+'</span> '+esc(x.content)+'<div class="small">'+new Date(x.created_at).toLocaleString()+'</div>'+(x.read?'':'<button class="btn secondary mark" data-id="'+x.id+'">Mark read</button>')+'</div>').join('')||'<div class="empty">No notifications yet</div>';document.querySelectorAll('.mark').forEach(b=>b.onclick=async()=>{await sb.from('notifications').update({read:true}).eq('id',b.dataset.id);loadAlerts()})}$('tileAlerts').onclick=async()=>{show('alertsPanel');await loadAlerts()};document.querySelector('[data-section="alerts"]').onclick=$('tileAlerts').onclick;
async function loadMessagePeople(q=''){let r=await sb.from('profiles').select('id,username,area').neq('id',user.id).limit(50);if(r.error)return;$('messagePeople').innerHTML=(r.data||[]).filter(x=>!q||x.username?.toLowerCase().includes(q.toLowerCase())).map(x=>'<div class="feeditem"><b>'+esc(x.username||'Member')+'</b> <button class="btn secondary startchat" data-id="'+x.id+'" data-name="'+esc(x.username||'Member')+'">Chat</button></div>').join('');document.querySelectorAll('.startchat').forEach(b=>b.onclick=()=>openChat(b.dataset.id,b.dataset.name))}$('messageSearch').oninput=()=>loadMessagePeople($('messageSearch').value);async function openChat(id,name){chatUser=id;$('chat').classList.remove('hidden');$('chatTitle').textContent='Chat with '+name;await loadChat()}async function loadChat(){let r=await sb.from('messages').select('*').or('and(sender_id.eq.'+user.id+',receiver_id.eq.'+chatUser+'),and(sender_id.eq.'+chatUser+',receiver_id.eq.'+user.id+')').order('created_at');if(r.error){$('chatMessages').textContent=r.error.message;return}$('chatMessages').innerHTML=(r.data||[]).map(m=>'<div class="feeditem" style="text-align:'+(m.sender_id===user.id?'right':'left')+'">'+esc(m.body)+'<div class="small">'+new Date(m.created_at).toLocaleString()+'</div></div>').join('');$('chatMessages').scrollTop=$('chatMessages').scrollHeight}$('sendMessage').onclick=async()=>{let body=$('messageBody').value.trim();if(!body||!chatUser)return;let r=await sb.from('messages').insert({sender_id:user.id,receiver_id:chatUser,body});if(r.error){alert(r.error.message);return}await sb.from('notifications').insert({user_id:chatUser,actor_id:user.id,kind:'message',content:'sent you a message'});$('messageBody').value='';loadChat()};$('tileMessages').onclick=()=>show('messagesPanel');document.querySelector('[data-section="profile"]').onclick=$('openProfile').onclick;document.querySelector('[data-section="explore"]').onclick=$('tileExplore').onclick=()=>{document.getElementById('search').focus();wi
