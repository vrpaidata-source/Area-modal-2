<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yenga Area Ulla Varatha...!!</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#1455e8;color:#fff}
body{overflow-x:hidden}
.main-entrance{min-height:100svh;background:linear-gradient(180deg,#1760f5,#1047d4);padding:24px 16px 40px;display:flex;align-items:center;justify-content:center}
.content{width:min(100%,1000px);margin:auto;text-align:center}
.site-title{font-size:clamp(2rem,7vw,4.2rem);line-height:1.05;font-weight:900;font-style:italic;color:#ffd52b;text-shadow:0 4px 0 #a96800,0 8px 16px #00266c;margin:0 0 18px}
.badge{display:inline-block;border:4px dashed #ffd52b;border-radius:20px;background:#082b85;padding:14px 22px;margin:0 auto 24px;box-shadow:0 8px 18px #001e6555}
.badge-main{font-size:clamp(1.4rem,5vw,2.5rem);font-weight:900;color:#ffd52b;line-height:1.1}
.badge-sub{font-size:clamp(1rem,3.5vw,1.35rem);font-weight:800;font-style:italic;margin-top:8px}
.video-frame{position:relative;width:min(100%,780px);height:clamp(280px,62vw,560px);margin:0 auto;overflow:hidden;border:3px solid rgba(255,213,43,.9);border-radius:22px;background:rgba(0,22,90,.15);box-shadow:0 12px 28px #001e6555}
.security-video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center center;display:block;background:transparent}
.frame-note{margin:12px 0 0;font-size:.9rem;color:#dbe7ff;opacity:.9}
@media(max-width:599px){
 .main-entrance{padding:18px 12px 32px;align-items:flex-start}
 .content{width:100%}
 .site-title{font-size:clamp(2rem,9vw,3.2rem);margin-bottom:14px}
 .badge{padding:12px 16px;margin-bottom:18px;border-radius:16px}
 .video-frame{width:100%;height:430px;border-radius:18px}
 .security-video{object-fit:contain;object-position:center center}
}
</style>
</head>
<body>
<section class="main-entrance">
 <main class="content">
  <h1 class="site-title">Yenga Area Ulla Varatha...!!</h1>
  <div class="badge">
   <div class="badge-main">80's &amp; 90's Kids</div>
   <div class="badge-sub">Allowed</div>
  </div>
  <div class="video-frame" aria-label="Security video crop frame">
   <video class="security-video" autoplay muted loop playsinline preload="metadata">
    <source src="security.webm" type="video/webm">
   </video>
  </div>
  <p class="frame-note">Main entrance video frame — crop and position will be adjusted next.</p>
 </main>
</section>
</body>
</html>
