<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0B3B3C"><title>Admin · Yenga Area</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Hind+Madurai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B3B3C;--teal:#14787A;--mint:#E3EFED;--gold:#F5A524;--red:#C8312B;--bg:#EEF3F2;--text:#14272A;--muted:#5B6F72;--line:#D9E4E2;--disp:'Bricolage Grotesque','Hind Madurai',system-ui,sans-serif;box-sizing:border-box}
*{box-sizing:inherit}body{margin:0;background:var(--bg);color:var(--text);font:1rem/1.5 'Hind Madurai',system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom,0)}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:calc(10px + env(safe-area-inset-top,0)) 14px 10px;display:flex;align-items:center;gap:10px}
header b{font-family:var(--disp);font-size:1.15rem;flex:1}header button{background:var(--mint);color:var(--ink)}
main{max-width:820px;margin:0 auto;padding:14px 12px 40px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 8px 24px -14px rgba(11,59,60,.3)}
h1,h2{font-family:var(--disp);color:var(--ink);margin:0 0 8px}h1{font-size:1.5rem}h2{font-size:1.1rem}
input,select{width:100%;min-height:46px;margin:6px 0;font:inherit;font-size:16px;padding:0 14px;border:1.5px solid var(--line);border-radius:14px;background:#f6faf9}
input:focus,select:focus{outline:3px solid #14787a40;border-color:var(--teal)}
button{min-height:44px;border:0;border-radius:12px;padding:0 14px;font:700 .9rem inherit;cursor:pointer;background:var(--gold);color:var(--ink)}
button.s{background:var(--mint)}button.d{background:#fbe4e2;color:#9b1c17}button:disabled{opacity:.5}button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.tabs button{background:#fff;border:1px solid var(--line);white-space:nowrap}.tabs button.on{background:var(--ink);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.small{font-size:.82rem;color:var(--muted)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.75rem;font-weight:700;background:var(--mint);color:var(--ink)}.pill.hi{background:var(--red);color:#fff}.pill.warn{background:#fff1c9}
.body{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6faf9;border-radius:12px;padding:10px;margin:8px 0}
img.pv{display:block;max-width:100%;max-height:300px;border-radius:12px;margin-top:6px}
#msg{min-height:1.4em;font-weight:700;color:var(--red)}#msg.ok{color:var(--teal)}.hidden{display:none!important}.center{text-align:center}
.qr{display:block;margin:8px auto;width:180px;height:180px;background:#fff;padding:6px;border-radius:12px}code{word-break:break-all;font-size:.8rem}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"><\/script>');</script></head>
<body><header><b>🛡️ Yenga Area Admin</b><button id="out" class="hidden">Sign out</button></header>
<main>
<p id="msg" role="status" aria-live="polite"></p>
<section id="vLogin" class="card hidden"><h1>Admin sign in</h1><form id="fLogin"><input id="em" type="email" autocomplete="username" placeholder="Email" aria-label="Email"><input id="pw" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password"><button style="width:100%;margin-top:8px">Sign in</button></form></section>
<section id="vEnroll" class="card hidden center"><h1>Set up 2-step verification</h1><p class="small">Authenticator app-ல் (Google Authenticator / Authy) இந்த QR scan பண்ணுங்க.</p><img id="qr" class="qr" alt="QR code"><p class="small">Scan ஆகலைன்னா key: <code id="sec"></code></p><input id="enCode" inputmode="numeric" maxlength="6" placeholder="6-digit code" aria-label="6 digit code"><button id="enGo" style="width:100%">Verify &amp; continue</button></section>
<section id="vMfa" class="card hidden center"><h1>2-step verification</h1><p class="small">Authenticator app-ல் உள்ள 6-digit code போடுங்க.</p><input id="mfCode" inputmode="numeric" maxlength="6" placeholder="6-digit code" aria-label="6 digit code"><button id="mfGo" style="width:100%">Verify</button></section>
<section id="vApp" class="hidden">
<div class="tabs" role="tablist"><button data-t="reports" class="on">Reports</button><button data-t="handled">Handled</button><button data-t="gender">Gender</button><button data-t="users">Users</button><button data-t="log">Log</button></div>
<div id="list"></div></section>
</main>
<script>
(()=>{
const sb=supabase.createClient('https://geinocdanrtpjbscfxhn.supabase.co','sb_publishable_uc09IiXZhBQD6TLKdHRVdg_GyT7yDN8');
const $=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const V=['vLogin','vEnroll','vMfa','vApp'];let tab='reports',idle;
function view(v){V.forEach(x=>$(x).classList.toggle('hidden',x!==v));$('out').classList.toggle('hidden',v==='vLogin');if(v==='vApp')bump()}
function say(t,ok){$('msg').textContent=t||'';$('msg').className=ok?'ok':''}
function bump(){clearTimeout(idle);idle=setTimeout(async()=>{await sb.auth.signOut();say('Inactive — signed out.');view('vLogin')},15*60*1000)}
['click','keydown','touchstart'].forEach(e=>document.addEventListener(e,()=>{if(!$('vApp').classList.contains('hidden'))bump()},{passive:true}));
async function gate(){say('');
  const s=(await sb.auth.getSession()).data.session;if(!s)return view('vLogin');
  const a=(await sb.auth.mfa.getAuthenticatorAssuranceLevel()).data;
  if(a?.currentLevel==='aal2')return check();
  const f=(await sb.auth.mfa.listFactors()).data||{},ver=(f.totp||[]).find(x=>x.status==='verified');
  if(ver){$('vMfa').dataset.f=ver.id;view('vMfa');return}
  for(const x of (f.all||[]).filter(x=>x.factor_type==='totp'&&x.status!=='verified'))await sb.auth.mfa.unenroll({factorId:x.id});
  const e=await sb.auth.mfa.enroll({factorType:'totp'});if(e.error)return say(e.error.message);
  $('vEnroll').dataset.f=e.data.id;$('qr').src=e.data.totp.qr_code;$('sec').textContent=e.data.totp.secret;view('vEnroll')}
async function check(){const r=await sb.rpc('is_admin');if(r.error||!r.data){view('vLogin');await sb.auth.signOut();return say('இந்த account admin இல்லை.')}view('vApp');load()}
async function verify(box,input){const fid=$(box).dataset.f,code=$(input).value.trim();if(!/^\d{6}$/.test(code))return say('6 digits போடுங்க.');
  const c=await sb.auth.mfa.challenge({factorId:fid});if(c.error)return say(c.error.message);
  const v=await sb.auth.mfa.verify({factorId:fid,challengeId:c.data.id,code});if(v.error)return say('Code தவறு. மீண்டும் முயற்சிக்கவும்.');$(input).value='';gate()}
$('enGo').onclick=()=>verify('vEnroll','enCode');$('mfGo').onclick=()=>verify('vMfa','mfCode');
$('fLogin').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;const r=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});b.disabled=false;if(r.error)return say('Email / password தவறு.');$('pw').value='';gate()};
$('out').onclick=async()=>{await sb.auth.signOut();view('vLogin')};
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));load()};
const ago=d=>new Date(d).toLocaleString();
async function act(args,ask){if(ask&&!confirm(ask))return;let note=null;if(args.p_kind!=='dismiss'&&args.p_kind!=='restore'&&args.p_kind!=='unban'){note=prompt('Note (காரணம்):','');if(note===null)return}
  const r=await sb.rpc('admin_act',{...args,p_note:note});if(r.error)return say(r.error.message);say('Done ✓',1);load()}
async function load(){const L=$('list');L.innerHTML='<div class="card small">Loading…</div>';say('');
  if(tab==='reports'||tab==='handled'){const r=await sb.rpc('admin_reports',{p_status:tab==='reports'?'open':'actioned'});if(r.error)return say(r.error.message);
    L.innerHTML=(r.data||[]).map(x=>`<div class="card"><span class="pill ${x.priority===1?'hi':''}">${x.priority===1?'URGENT':'Normal'}</span> <span class="pill">${esc(x.reason)}</span> ${x.post_hidden?'<span class="pill warn">Hidden</span>':''}${x.banned?' <span class="pill hi">Banned</span>':''}
    <p class="small">${x.report_count} report(s) · reported by ${esc(x.reporter_name||'?')} · ${ago(x.created_at)}</p><b>${esc(x.reported_name||'Member')}</b>
    <div class="body">${esc(x.post_body||'[post not found]')}</div>${x.post_image?`<img class="pv" loading="lazy" src="${esc(x.post_image)}" alt="">`:''}${x.admin_note?`<p class="small">Note: ${esc(x.admin_note)}</p>`:''}
    ${tab==='reports'?`<div class="row" data-r="${x.id}" data-p="${x.post_id||''}" data-u="${x.reported_id||''}"><button data-k="hide" class="s">Hide post</button><button data-k="remove" class="d">Remove</button><button data-k="dismiss" class="s">Dismiss</button><button data-k="suspend" class="s">Suspend 7d</button><button data-k="ban" class="d">Ban user</button></div>`:`<div class="row" data-p="${x.post_id||''}"><button data-k="restore" class="s">Restore post</button></div>`}</div>`).join('')||'<div class="card small center">எதுவும் இல்லை ✓</div>';signImgs();return}
  if(tab==='gender'){const r=await sb.rpc('admin_gender_corrections');if(r.error)return say(r.error.message);
    L.innerHTML=(r.data||[]).map(x=>`<div class="card"><b>${esc(x.username||'Member')}</b><p class="small">${esc(x.current_gender)} → <b>${esc(x.requested_gender)}</b> · ${ago(x.created_at)}</p><div class="body">${esc(x.reason||'—')}</div><div class="row" data-g="${x.id}"><button data-k="gok">Approve</button><button data-k="gno" class="s">Reject</button></div></div>`).join('')||'<div class="card small center">Pending requests இல்லை</div>';return}
  if(tab==='users'){L.innerHTML='<div class="card"><input id="uq" placeholder="Username தேடு" aria-label="Search username"><div id="ur"></div></div>';let t;$('uq').oninput=()=>{clearTimeout(t);t=setTimeout(users,300)};users();return}
  const r=await sb.rpc('admin_log');if(r.error)return say(r.error.message);
  L.innerHTML=(r.data||[]).map(x=>`<div class="card"><span class="pill">${esc(x.action)}</span> <b>${esc(x.target_name||'')}</b><p class="small">by ${esc(x.admin_name||'admin')} · ${ago(x.created_at)}</p>${x.note?`<div class="body">${esc(x.note)}</div>`:''}</div>`).join('')||'<div class="card small center">Log காலி</div>'}
async function signImgs(){const RX=/\/storage\/v1\/object\/public\/(post-photos|profile-photos)\/([^?#]+)/;
  for(const im of document.querySelectorAll('img.pv')){const m=RX.exec(im.getAttribute('src')||'');if(!m)continue;const r=await sb.storage.from(m[1]).createSignedUrl(decodeURIComponent(m[2]),3600);if(r.data?.signedUrl)im.src=r.data.signedUrl;else im.alt='(photo unavailable)'}}
async function users(){const r=await sb.rpc('admin_users',{p_q:$('uq').value.trim()});if(r.error)return say(r.error.message);
  $('ur').innerHTML=(r.data||[]).map(x=>`<div class="card"><b>${esc(x.username||'Member')}</b> ${x.banned?'<span class="pill hi">Banned</span>':''}<div class="small">${esc(x.area||'')}</div><div class="row" data-u="${x.id}">${x.banned?'<button data-k="unban" class="s">Unban</button>':'<button data-k="suspend" class="s">Suspend 7d</button><button data-k="ban" class="d">Ban</button>'}</div></div>`).join('')||'<div class="small">யாரும் இல்லை</div>'}
$('list').onclick=async e=>{const b=e.target.closest('button[data-k]');if(!b)return;const w=b.closest('[data-r],[data-u],[data-p],[data-g]'),k=b.dataset.k;
  if(k==='gok'||k==='gno'){if(!confirm(k==='gok'?'Gender மாற்ற approve பண்ணவா?':'Reject பண்ணவா?'))return;const r=await sb.rpc('admin_review_gender_correction',{p_id:w.dataset.g,p_approve:k==='gok'});if(r.error)return say(r.error.message);say('Done ✓',1);return load()}
  const d=w.dataset,args={p_kind:k,p_report:d.r||null,p_user:d.u||null,p_post:d.p||null,p_days:7};
  const ask={ban:'இந்த user-ஐ permanent ban பண்ணவா?',remove:'Post-ஐ நிரந்தரமா remove பண்ணவா?',suspend:'7 நாள் suspend பண்ணவா?'}[k];
  await act(args,ask);if(tab==='users')users()};
gate();
})();
</script></body></html>
